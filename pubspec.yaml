name: daily_check_in
description: A production-ready Daily Check-In Flutter app using Clean Architecture and BLoC.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  intl: ^0.18.1

  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
